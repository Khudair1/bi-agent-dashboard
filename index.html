<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#08111f"/>
<title>BI Agent Control Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07101d;--panel:#0f1b2d;--panel2:#132238;--line:#213752;--text:#eef5ff;--muted:#8fa3bd;--accent:#74a7ff;--good:#61d095;--warn:#ffc857;--bad:#ff7b7b;--shadow:0 14px 40px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#07101d 0%,#0a1524 100%);color:var(--text);min-height:100vh}.shell{max-width:1500px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px}.brand h1{font-size:25px;margin:0;letter-spacing:-.03em}.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.badge,.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11px}.badge{color:var(--muted)}.btn{border:0;border-radius:10px;background:var(--accent);color:#06101d;font-weight:750;padding:11px 14px;cursor:pointer}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:rgba(15,27,45,.94);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}.metric{font-size:29px;font-weight:800;margin-top:8px;letter-spacing:-.03em}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 11px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:840px}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#0b1727;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.empty{padding:20px;text-align:center;color:var(--muted)}.login{max-width:430px;margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.login h1{margin:3px 0 8px;letter-spacing:-.03em}.login p{color:var(--muted);line-height:1.55}.login input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#091422;color:var(--text);outline:none;margin:12px 0}.msg{margin-top:12px;padding:11px;border-radius:10px;font-size:13px}.success{background:rgba(97,208,149,.08);border:1px solid rgba(97,208,149,.3);color:#c7f4da}.error{background:rgba(255,123,123,.08);border:1px solid rgba(255,123,123,.3);color:#ffc4c4}.tiny{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}.loading{max-width:420px;margin:12vh auto;text-align:center;color:var(--muted)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:650px){.shell{padding:13px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.metric{font-size:23px}.login{margin:7vh 14px}.actions{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://zcqjmsotvmufmkrwwuex.supabase.co';
const SB_KEY='sb_publishable_zUc8qWASE25CqAHzOHdMrQ_5JD1r9KK';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>'$'+Number(v||0).toFixed(2);
const fmtDate=v=>v?new Date(v).toLocaleString():'—';
function cls(s){s=String(s||'').toLowerCase();if(['passed','completed','report_generated','qa_approved_generated','active','won'].includes(s))return'good';if(['blocked','failed','lost'].includes(s))return'bad';return'warn'}
function login(message=''){
  app.innerHTML=`<div class="login"><div class="label">Private workspace</div><h1>BI Agent Control Center</h1><p>Sign in with your authorized email. A secure magic link will be sent to your inbox.</p><input id="email" type="email" autocomplete="email" value="khudairahmedshaikh@gmail.com"/><button class="btn" id="send">Send login link</button><div id="message">${message}</div><div class="tiny">Only approved dashboard users can access client, CRM, report and finance data.</div></div>`;
  document.getElementById('send').onclick=async()=>{
    const email=document.getElementById('email').value.trim();if(!email)return;
    const b=document.getElementById('send');b.disabled=true;b.textContent='Sending…';
    const redirect=location.origin+location.pathname;
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}});
    document.getElementById('message').innerHTML=error?`<div class="msg error">${esc(error.message)}</div>`:`<div class="msg success">Login link sent. Open the email on this device.</div>`;
    b.disabled=false;b.textContent='Send login link';
  }
}
async function api(session){
  const r=await fetch(SB_URL+'/functions/v1/bi-dashboard-api',{headers:{Authorization:'Bearer '+session.access_token,apikey:SB_KEY}});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Dashboard API failed');return d;
}
function metric(label,value){return`<div class="card"><div class="label">${esc(label)}</div><div class="metric">${esc(value)}</div></div>`}
function projects(a){if(!a.length)return'<div class="empty">No projects yet.</div>';return`<table><thead><tr><th>Company</th><th>Project</th><th>Client</th><th>QA</th><th>Report</th><th>Latest agent</th><th>Open revisions</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.company_name)}</b><br><span class="muted">${esc(x.website_url)}</span></td><td><span class="pill ${cls(x.project_status)}">${esc(x.project_status)}</span></td><td>${esc(x.client_status||'—')}</td><td><span class="pill ${cls(x.latest_qa_status)}">${esc(x.latest_qa_status||'—')}</span> ${esc(x.latest_qa_score??'')}</td><td>${esc(x.latest_report_status||'—')}</td><td>${esc(x.latest_agent_name||'—')}<br><span class="muted">${esc(x.latest_agent_status||'')}</span></td><td>${esc(x.open_revision_count||0)}</td></tr>`).join('')}</tbody></table>`}
function pipeline(a){if(!a.length)return'<div class="empty">No open CRM stages yet.</div>';return`<table><thead><tr><th>Stage</th><th>Leads</th><th>High priority</th><th>Due</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.stage)}</td><td>${esc(x.lead_count)}</td><td>${esc(x.high_priority_count)}</td><td>${esc(x.followups_due)}</td></tr>`).join('')}</tbody></table>`}
function finance(a){if(!a.length)return'<div class="empty">No finance records yet.</div>';return`<table><thead><tr><th>Project</th><th>Tracking</th><th>Revenue</th><th>API cost</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.company_name)}</td><td>${esc(x.financial_tracking_status)}</td><td>${money(x.recorded_revenue_usd)}</td><td>${money(x.recorded_api_cost_usd)}</td></tr>`).join('')}</tbody></table>`}
function reports(a){if(!a.length)return'<div class="empty">No reports yet.</div>';return`<table><thead><tr><th>Company</th><th>Status</th><th>QA</th><th>Score</th><th>Assets</th><th>Created</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.company_name)}</td><td>${esc(x.report_status)}</td><td><span class="pill ${cls(x.qa_status)}">${esc(x.qa_status||'—')}</span></td><td>${esc(x.qa_score??'—')}</td><td>${esc(x.asset_count||0)}</td><td>${fmtDate(x.report_created_at)}</td></tr>`).join('')}</tbody></table>`}
function activity(a){if(!a.length)return'<div class="empty">No activity yet.</div>';return`<table><thead><tr><th>Agent</th><th>Action</th><th>Status</th><th>Started</th><th>Error</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.agent_name)}</td><td>${esc(x.action)}</td><td><span class="pill ${cls(x.status)}">${esc(x.status)}</span></td><td>${fmtDate(x.started_at)}</td><td>${esc(x.error_message||'—')}</td></tr>`).join('')}</tbody></table>`}
function render(d){const s=d.summary||{};app.innerHTML=`<div class="shell"><div class="top"><div class="brand"><h1>BI Agent Control Center</h1><p>Research → Strategy → QA → Reports → CRM → Finance</p></div><div class="actions"><span class="badge">${esc(d.user?.role||'user')}</span><button class="btn secondary" id="refresh">Refresh</button><button class="btn secondary" id="logout">Log out</button></div></div><div class="grid">${metric('Active clients',s.active_clients||0)}${metric('Open leads',s.open_leads||0)}${metric('Reports ready',s.reports_ready||0)}${metric('QA passed',s.latest_qa_passed_projects||0)}${metric('Revenue recorded',money(s.recorded_revenue_usd))}${metric('API cost recorded',money(s.recorded_api_cost_usd))}${metric('Follow-ups due',s.followups_due||0)}${metric('Unpriced API events',s.unpriced_api_events||0)}</div><div class="section"><h2>Projects & clients</h2><div class="tablewrap">${projects(d.projects||[])}</div></div><div class="two section"><div><h2>CRM pipeline</h2><div class="tablewrap">${pipeline(d.crm_pipeline||[])}</div></div><div><h2>Finance tracking</h2><div class="tablewrap">${finance(d.finance||[])}</div></div></div><div class="section"><h2>Report library</h2><div class="tablewrap">${reports(d.reports||[])}</div></div><div class="section"><h2>Recent agent activity</h2><div class="tablewrap">${activity(d.recent_agent_activity||[])}</div></div></div>`;
  document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();login()};document.getElementById('refresh').onclick=load;
}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){login();return}app.innerHTML='<div class="loading"><h2>Loading dashboard…</h2><p>Fetching BI, CRM and finance status.</p></div>';try{render(await api(session))}catch(e){login(`<div class="msg error">${esc(e.message)}</div>`)}}
sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script>
</body>
</html>
